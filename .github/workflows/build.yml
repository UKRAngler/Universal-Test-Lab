name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build and run self-tests
        shell: powershell
        run: .\Build.ps1 -SelfTest

      - name: Package release
        shell: powershell
        run: .\Package-Release.ps1 -Version v0.12.0

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Test-Lab-${{ github.sha }}
          path: |
            dist/UniversalTestLab.exe
            dist/Universal_Test_Lab_v0.12.0.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
